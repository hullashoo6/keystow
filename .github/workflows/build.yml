name: Build Windows installer

on:
  push:
    branches: [main]
    paths: ['run_murmur.py', 'murmur/**', 'requirements.txt', 'installer/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build Murmur.exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name Murmur --collect-all faster_whisper --collect-all ctranslate2 run_murmur.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc installer\setup.iss
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 installer\installer\MurmurSetup.exe --clobber || gh release create v1.0.0 installer\installer\MurmurSetup.exe --title "Murmur v1.0.0" --notes "First release: push-to-talk voice typing for Windows. Download MurmurSetup.exe, run it, and Murmur appears in your tray. Hold Right Ctrl, speak, release."
