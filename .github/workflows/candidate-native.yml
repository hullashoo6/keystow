name: Mac native packaging and compatibility evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-native:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 436e575a97fb4967bbddf5d126f448ca1f02f17e
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Mac native packaging, launch and quarantined delivery checks
        run: |
          python - <<'PYMAC'
          from pathlib import Path
          import os,sys,json,base64,subprocess,importlib.util,traceback,shutil,plistlib,hashlib,re
          root=Path.cwd();ev=root/'mac-evidence';ev.mkdir()
          def run(args,check=True):
           r=subprocess.run([str(x) for x in args],capture_output=True,text=True)
           if check and r.returncode:raise RuntimeError(str(args)+' '+r.stdout[-4000:]+r.stderr[-4000:])
           return {'exit':r.returncode,'stdout':r.stdout,'stderr':r.stderr}
          patches={'keystow/single_instance.py': '', 'keystow/ui.py': '', 'tests/test_single_instance.py': '', 'installer/native_candidate/runtime_hook.py': ''}
          patches['tests/test_typer.py']=''
          for n,b64 in patches.items():(root/n).write_bytes(base64.b64decode(b64))
          u=root/'keystow/ui.py';u.write_text(u.read_text().replace('Windows test','Mac test'))
          try:
           p=root/'installer/native_candidate/build_candidate.py';s=p.read_text()
           # macOS needs only its native PortAudio library, not foreign Windows variants.
           s=s.replace("    if sys.platform == 'win32':\n        for variant", "    if sys.platform == 'darwin':\n        for other in (dist/'_internal/_sounddevice_data/portaudio-binaries').glob('*.dll'): other.unlink()\n    if sys.platform == 'win32':\n        for variant")
           # The actual macOS app bundle is produced alongside the onedir target.
           s=s.replace("'--console', '--name'", "'--windowed', '--icon', str(ROOT/'installer/keystow.icns'), '--name'")
           # This Windows-only Qt overlay test cannot be applied to a macOS framework.
           start=s.index("    modified_qt = WORK/'modified-qt'");end=s.index('    native_inventory(dist,exe)',start)
           s=s[:start]+"    if sys.platform == 'win32':\n"+''.join('    '+line+'\n' for line in s[start:end].splitlines())+s[end:]
           # pynput remains external source; its macOS dynamic backends need frozen PyObjC frameworks.
           s=s.replace("'--exclude-module','pynput'", "'--collect-all','Quartz','--collect-all','AppKit','--collect-all','Foundation','--collect-all','CoreFoundation','--hidden-import','objc','--hidden-import','PyObjCTools','--hidden-import','PyObjCTools.AppHelper','--exclude-module','pynput'")
           p.write_text(s)
           run([sys.executable,'-m','pip','install','pillow==13.0.0'])
           run([sys.executable,root/'installer/make_icons.py'])
           sys.path.insert(0,str(p.parent));spec=importlib.util.spec_from_file_location('mac_builder',p);builder=importlib.util.module_from_spec(spec);spec.loader.exec_module(builder)
           builder.main()
           app=root/'candidate-work/dist/KeyStowCandidate.app';assert app.is_dir()
           info=app/'Contents/Info.plist';d=plistlib.loads(info.read_bytes());d.update(CFBundleDisplayName='KeyStow Mac Test',CFBundleName='KeyStow',CFBundleIdentifier='com.keystow.test',CFBundleShortVersionString='1.0.2',CFBundleVersion='1.0.2.3',NSMicrophoneUsageDescription='KeyStow uses your microphone only while you dictate locally.');info.write_bytes(plistlib.dumps(d))
           (ev/'bundle-info.json').write_text(json.dumps(d,indent=2))
           sign=run(['codesign','--force','--deep','--sign','-',app]);verification=run(['codesign','--verify','--deep','--strict','--verbose=2',app],False)
           arch=run(['lipo','-archs',app/'Contents/MacOS/KeyStowCandidate'])
           (ev/'architecture-signing.json').write_text(json.dumps({'architecture':arch,'signing':verification},indent=2))
           assert 'arm64' in arch['stdout'],'Do not imply unsupported target architecture'
           dmgs=root/'mac-dmg-source';dmgs.mkdir();shutil.copytree(app,dmgs/app.name,symlinks=True);os.symlink('/Applications',dmgs/'Applications')
           dmg=root/'KeyStow-Mac-AppleSilicon-Test.dmg';run(['hdiutil','create','-volname','KeyStow Mac Test','-srcfolder',dmgs,'-ov','-format','UDZO',dmg])
           attach=run(['hdiutil','attach','-nobrowse','-readonly','-plist',dmg]);mount=next(x['mount-point'] for x in plistlib.loads(attach['stdout'].encode())['system-entities'] if 'mount-point' in x)
           installed=root/'installed Mac test é';shutil.copytree(Path(mount)/app.name,installed,symlinks=True);run(['hdiutil','detach',mount])
           env=dict(os.environ,QT_QPA_PLATFORM='offscreen',PYNPUT_BACKEND='dummy',HF_HUB_OFFLINE='1',TRANSFORMERS_OFFLINE='1',KEYSTOW_MODEL='base',CANDIDATE_EVIDENCE_DIR=str(ev))
           probes={}
           for name,arg in [('inference','--candidate-probe'),('integrity','--candidate-code-substitution'),('ready','--candidate-ui-smoke')]:
            r=subprocess.run([str(installed/'Contents/MacOS/KeyStowCandidate'),arg],env=env,capture_output=True,text=True,timeout=180);probes[name]={'exit':r.returncode,'stdout':r.stdout[-2000:],'stderr':r.stderr[-2000:]};assert r.returncode==0,name
           (ev/'mounted-dmg-probes.json').write_text(json.dumps(probes,indent=2))
           # Quarantine and Gatekeeper assessment reflect downloaded unsigned delivery.
           run(['xattr','-w','com.apple.quarantine','0083;00000000;KeyStowTest;',installed])
           gatekeeper=run(['spctl','--assess','--type','execute','--verbose=4',installed],False)
           verdict={'platform':run(['sw_vers']), 'machine':run(['uname','-m']), 'architecture':arch,'info_plist':d,'codesign_verify':verification,'gatekeeper_quarantined_app':gatekeeper,'native_probes':probes,'dmg_bytes':dmg.stat().st_size,'dmg_sha256':hashlib.sha256(dmg.read_bytes()).hexdigest(),'source_recipe_commit':os.environ['GITHUB_SHA'],'notarized':False,'developer_id_signed':False,'physical_microphone_shortcut_paste_acceptance':False,'not_for_public_download':True,'rights_clearance':False,'distribution_notice_audit_complete':False}
           (ev/'mac-verdict.json').write_text(json.dumps(verdict,indent=2));print(json.dumps(verdict,indent=2))
          except Exception:
           (ev/'mac-failure.json').write_text(json.dumps({'traceback':traceback.format_exc(),'public_download_ready':False},indent=2));raise
          finally:
           if (root/'candidate-evidence').exists():shutil.copytree(root/'candidate-evidence',ev/'build-evidence',ignore=shutil.ignore_patterns('*.zip','*.tar.gz'))
          PYMAC
      - name: Preserve Mac metadata and screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac-native-availability-evidence
          path: mac-evidence/
          retention-days: 1
          if-no-files-found: error
