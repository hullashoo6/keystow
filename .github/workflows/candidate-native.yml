name: KeyStow candidate native evidence - NOT FOR RELEASE

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact candidate commit SHA
        required: true
        type: string
      candidate_label:
        description: Must be NOT-FOR-RELEASE
        required: true
        default: NOT-FOR-RELEASE
        type: string

permissions:
  contents: write

concurrency:
  group: keystow-candidate-native
  cancel-in-progress: false

jobs:
  native:
    name: Candidate evidence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate candidate identity before checkout or dependencies
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CANDIDATE_LABEL: ${{ inputs.candidate_label }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os,re
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['EXPECTED_SHA'])
          assert os.environ['EXPECTED_SHA']==os.environ['ACTUAL_SHA']
          assert os.environ['ACTUAL_REF']=='refs/heads/candidate/numpy-native-20261119'
          assert os.environ['CANDIDATE_LABEL']=='NOT-FOR-RELEASE'
          print('Exact candidate identity PASS; no release authority implied')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build and inspect native candidate, with no publisher
        run: python installer/native_candidate/build_candidate.py
      - name: Seal bounded safe evidence even after a target failure
        if: always()
        id: seal
        run: python installer/native_candidate/build_candidate.py --seal
      - name: Store one-day diagnostic metadata only, no binary
        if: always() && steps.seal.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NOT-FOR-RELEASE-${{ matrix.os }}-${{ github.sha }}
          path: candidate-upload/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false

      - name: Transfer passing private test only to existing unpublished owner draft
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,subprocess,pathlib,hashlib,urllib.request,urllib.parse
          repo=os.environ['GH_REPO']; assert repo=='hullashoo6/keystow'
          draft=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/452144563']))
          assert draft['draft'] is True and draft['tag_name']=='private-owner-test-20261120'
          assert draft['name']=='PRIVATE OWNER TEST TRANSFER ONLY - NOT A RELEASE'
          record=json.loads(pathlib.Path('candidate-evidence/candidate-archive.json').read_text())
          path=pathlib.Path('candidate-evidence')/record['filename']
          data=path.read_bytes(); assert hashlib.sha256(data).hexdigest()==record['sha256']
          assert json.loads(pathlib.Path('candidate-evidence/rnnoise-source.json').read_text())['bundled'] is False
          assert json.loads(pathlib.Path('candidate-evidence/qt-modified-library.json').read_text())['actual_entrypoint_ready'] is True
          name='PRIVATE-Windows-NO-DENOISE-'+os.environ['GITHUB_SHA']+'.zip'
          assert not any(x['name']==name for x in draft['assets']), 'Do not overwrite or duplicate an existing transfer'
          url=draft['upload_url'].split('{')[0]+'?'+urllib.parse.urlencode({'name':name})
          request=urllib.request.Request(url,data=data,method='POST',headers={
             'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/zip',
             'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=180) as response: asset=json.load(response)
          assert asset['size']==len(data)
          print(json.dumps({'draft_id':draft['id'],'draft':True,'asset_id':asset['id'],
             'name':asset['name'],'size':asset['size'],'sha256':record['sha256'],
             'owner_handover':False,'release_published':False}))
          PY
