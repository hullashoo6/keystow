# Publishes the website (docs/) to Cloudflare Pages: https://keystow.pages.dev
# Runs on every push to main that changes docs/, and by hand (Actions tab).
#
# The site moved here from GitHub Pages on 28 Nov 2026. GitHub Pages now
# serves only forwarding pages (branch site-forwarding) so old links keep
# working; do not publish the site there again.
#
# Needs the repository secret CLOUDFLARE_API_TOKEN (Cloudflare: My Profile >
# API Tokens > Create Token, permission "Cloudflare Pages: Edit") and the
# variable CLOUDFLARE_ACCOUNT_ID. Without the token the job says so and
# publishes nothing; publish by hand with
#   npx wrangler pages deploy docs --project-name keystow --branch main
name: Website

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Use the new address everywhere
        # Anything copied from an older page that still names the old
        # address is corrected before publishing.
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const swap = (s) => s
              .split("https://hullashoo6.github.io/keystow").join("https://keystow.pages.dev")
              .split("https%3A%2F%2Fhullashoo6.github.io%2Fkeystow").join("https%3A%2F%2Fkeystow.pages.dev")
              .split("hullashoo6.github.io/keystow").join("keystow.pages.dev");
            const walk = (d) => fs.readdirSync(d).forEach((n) => {
              const p = path.join(d, n);
              if (fs.statSync(p).isDirectory()) return walk(p);
              if (!/\.(html|xml|txt|css|js|json)$/i.test(p)) return;
              const s = fs.readFileSync(p, "utf8"), t = swap(s);
              if (t !== s) { fs.writeFileSync(p, t); console.log("corrected old address in", p); }
            });
            walk("docs");'
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so nothing was published. Add it under Settings > Secrets and variables > Actions, or publish by hand."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy docs --project-name keystow --branch main --commit-dirty=true
