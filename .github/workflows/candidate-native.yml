name: Verify actual corrected private draft downloads
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 436e575a97fb4967bbddf5d126f448ca1f02f17e
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install pefile==2023.2.7 pyinstaller==6.16.0
      - name: Download and verify notice addendum and verify existing digests without changing either draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import os,json,subprocess,pathlib,hashlib,urllib.request,zipfile,datetime
          out=pathlib.Path('diagnostic-evidence');out.mkdir()
          draft=json.loads(subprocess.check_output(['gh','api','repos/hullashoo6/keystow/releases/452231425']))
          assert draft['draft'] and draft['id']==452231425
          expected={'1-KeyStow-NOTICE-ADDENDUM-Qt-Mesa-LLVM-image-codecs-20261120.zip':(185323,'2886b5c0020e4574079232c70d14c9eeccc05cdbae13505818ff1216d966a795')}
          assert next(x for x in draft['assets'] if x['id']==770297672)['digest']=='sha256:eb01efe84f8c5bf64e0873e69866e4ed82184353e2b8af096f6d735a83ac0972'
          assert next(x for x in draft['assets'] if x['id']==770303219)['digest']=='sha256:04fcc165a85add9aaa05c7708274a3413299db18a3a9c3b63a11ad2d79623887'
          rows=[]
          for name,(size,want) in expected.items():
              asset=next(x for x in draft['assets'] if x['name']==name)
              req=urllib.request.Request(asset['url'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/octet-stream'})
              start=datetime.datetime.now(datetime.timezone.utc).isoformat()
              with urllib.request.urlopen(req,timeout=180) as response:data=response.read();status=response.status
              digest=hashlib.sha256(data).hexdigest();assert status==200 and len(data)==size and digest==want
              temp=pathlib.Path(name);temp.write_bytes(data)
              with zipfile.ZipFile(temp) as z:assert z.testzip() is None;entries=len(z.namelist())
              rows.append({'name':name,'asset_id':asset['id'],'bytes':len(data),'sha256':digest,'http_status':status,'zip_entries':entries,'started_at':start,'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'url':asset['browser_download_url']})
          (out/'authenticated-download-verdict.json').write_text(json.dumps({'draft_id':452231425,'draft_url':draft['html_url'],'mutations':False,'actual_downloads':rows},indent=2));print((out/'authenticated-download-verdict.json').read_text())
          PYCODE
      - name: Preserve bounded diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notice-addendum-authenticated-download-evidence
          path: diagnostic-evidence/
          retention-days: 1
          if-no-files-found: error
