name: Windows clipboard check

# Runs KeyStow's paste/clipboard logic against the real Win32 clipboard of a
# throwaway GitHub-hosted Windows machine. That clipboard belongs to nobody,
# so this is the one place the real-clipboard test is allowed to touch it.
# Quick (a couple of minutes), separate from the installer build.

on:
  pull_request:
    paths:
      - 'keystow/win_delivery.py'
      - 'keystow/typer.py'
      - 'tests/win_clipboard_isolated.py'
      - 'tests/test_win_delivery.py'
      - '.github/workflows/clipboard-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clipboard:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Real-clipboard round trips
        run: python tests/win_clipboard_isolated.py
      - name: Delivery unit tests
        run: python -m unittest tests.test_win_delivery -v
