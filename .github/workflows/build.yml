name: Build and release KeyStow installers

# Two ways in.
#
# A pull request that touches the app or its build: both installers are built
# and checked exactly as for a release and kept as downloadable artifacts.
# Nothing is published.
#
# Run by hand from main, with the version to publish. That version must be the
# one in keystow/__init__.py and must have a section in CHANGELOG.md. By
# default it is published as a pre-release: the website keeps serving the
# previous release until the installers have been tried on real computers and
# the "Promote a tested pre-release" workflow is run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish as a pre-release, for example 1.0.7 (must match keystow/__init__.py)
        required: true
        type: string
      # There is deliberately no way to publish straight to "latest": every
      # version is tried on real computers first, then promoted.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'notes/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'keystow-release' || format('keystow-check-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The speech model that ships inside the app, pinned to an exact revision.
  MODEL_REPO: Systran/faster-whisper-base
  MODEL_REVISION: ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66

jobs:
  check:
    name: Check version and branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read the version; a release must be a new version built from main
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r' < keystow/__init__.py | sed -n 's/^__version__ = "\(.*\)"$/\1/p')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "keystow/__init__.py has no version that looks like 1.0.7"; exit 1; }
          python3 installer/release_notes.py "$VERSION" > /dev/null || { echo "CHANGELOG.md has no notes for v$VERSION"; exit 1; }
          if [ "$EVENT" = workflow_dispatch ]; then
            test "$REQUESTED" = "$VERSION" || { echo "Asked to publish $REQUESTED, but keystow/__init__.py says $VERSION"; exit 1; }
            test "$GITHUB_REF" = refs/heads/main || { echo "Run this workflow from main"; exit 1; }
            existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$VERSION" --jq 'length')
            test "$existing" = 0 || { echo "A tag starting with v$VERSION already exists"; exit 1; }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building KeyStow $VERSION ($EVENT)" | tee -a "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies at the pinned versions
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow psutil huggingface-hub -c installer/constraints.txt
      - name: Component tests (controlled input and output, not a real microphone)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      # KeyStow never decodes audio files, so PyAV (FFmpeg, with the GPL x264
      # and x265 encoders, about 77 MB) is replaced by installer/stubs/av.
      - name: Remove PyAV from the build environment
        run: python -m pip uninstall -y av
      - name: Generate app icons
        run: python installer/make_icons.py
      - name: Gather third-party licences and write the version details for KeyStow.exe
        run: |
          python installer/collect_licenses.py build-licenses
          python installer/make_version_file.py "$env:VERSION" build-version-info.txt
      - name: Fetch RNNoise native library
        run: |
          pip download pyrnnoise==0.4.5 --no-deps --platform win_amd64 --python-version 3.11 --only-binary :all: -d vendor_dl
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('vendor_dl/*.whl')[0]); z.extract('pyrnnoise-0.4.5.data/purelib/pyrnnoise/rnnoise.dll','vendor_dl')"
          copy vendor_dl\pyrnnoise-0.4.5.data\purelib\pyrnnoise\rnnoise.dll keystow\vendor\rnnoise.dll
      - name: Download the bundled speech model at its pinned revision
        run: python -c "import os; from huggingface_hub import snapshot_download; snapshot_download(os.environ['MODEL_REPO'], revision=os.environ['MODEL_REVISION'], local_dir='models/faster-whisper-base')"
      # A folder build: KeyStow.exe plus an _internal folder of ordinary files.
      # The earlier single-file build unpacked about 500 MB into the temp folder
      # at every start and left it behind after an unclean exit.
      - name: Build the KeyStow folder with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name KeyStow --icon installer\keystow.ico --version-file build-version-info.txt --add-data "models/faster-whisper-base;models/faster-whisper-base" --add-binary "keystow/vendor/rnnoise.dll;keystow/vendor" --add-data "keystow/fonts;keystow/fonts" --paths installer\stubs --additional-hooks-dir installer\hooks --exclude-module PIL --exclude-module hf_xet --collect-all faster_whisper --collect-all ctranslate2 run_keystow.py
          # Qt's software OpenGL renderer (about 20 MB): KeyStow's window is plain
          # widgets and never creates an OpenGL context.
          Remove-Item dist\KeyStow\_internal\PySide6\opengl32sw.dll -ErrorAction SilentlyContinue
          # Nothing from FFmpeg may ship, and pynput must be replaceable source.
          $ffmpeg = Get-ChildItem dist\KeyStow -Recurse -File | Where-Object { $_.Name -match '^(avcodec|avformat|avutil|swresample|swscale|libx26[45]|av\.libs)' }
          if ($ffmpeg) { throw "FFmpeg libraries in the build: $($ffmpeg.Name -join ', ')" }
          if (-not (Test-Path dist\KeyStow\_internal\pynput\__init__.py)) { throw "pynput is not shipped as source" }
      - name: Check the folder has the app, its version, the speech model, the noise library and the licences
        run: |
          foreach ($path in 'dist\KeyStow\KeyStow.exe', 'dist\KeyStow\_internal\models\faster-whisper-base\model.bin', 'dist\KeyStow\_internal\keystow\vendor\rnnoise.dll', 'dist\KeyStow\_internal\keystow\fonts\InstrumentSans-Variable.ttf', 'dist\KeyStow\_internal\keystow\fonts\OFL.txt', 'build-licenses\THIRD-PARTY-NOTICES.txt', 'build-licenses\LICENSE.txt', 'build-licenses\texts\GPL-3.0.txt') {
            if (-not (Test-Path $path)) { throw "Missing from the build: $path" }
          }
          $reported = (Get-Item dist\KeyStow\KeyStow.exe).VersionInfo.ProductVersion
          if ($reported -ne $env:VERSION) { throw "KeyStow.exe reports version '$reported', expected $env:VERSION" }
      - name: Packaged app must load its own model and recognise the speech sample
        run: python installer/verify_self_test.py dist/KeyStow/KeyStow.exe release-evidence
      - name: Packaged app must open its window, refuse a second copy and close cleanly
        run: python installer/verify_candidate_processes.py dist/KeyStow/KeyStow.exe release-evidence
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc "/DMyAppVersion=$env:VERSION" installer\setup.iss
      - name: Stage Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: installer/installer/KeyStowSetup.exe
          retention-days: 14
          if-no-files-found: error
      - name: Keep the packaged-app check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-evidence
          path: |
            release-evidence/
            build-licenses/THIRD-PARTY-NOTICES.txt
          retention-days: 30
          if-no-files-found: ignore

  build-mac:
    name: Mac installer (Apple Silicon)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Require an Apple Silicon build machine
        run: test "$(uname -m)" = arm64
      - name: Install Python dependencies at the pinned versions
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow psutil huggingface-hub -c installer/constraints.txt
      - name: Component tests (controlled input and output, not a real microphone)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Remove PyAV from the build environment (replaced by installer/stubs/av)
        run: python -m pip uninstall -y av
      - name: Generate app icon, gather third-party licences and fetch the bundled speech model at its pinned revision
        run: |
          python installer/make_icons.py
          python installer/collect_licenses.py build-licenses
          python -c "import os; from huggingface_hub import snapshot_download; snapshot_download(os.environ['MODEL_REPO'], revision=os.environ['MODEL_REVISION'], local_dir='models/faster-whisper-base')"
      # A normal app bundle with its files inside it, not a single file that
      # unpacks itself into the temp folder at every start.
      - name: Build KeyStow.app with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --name KeyStow --icon installer/keystow.icns --osx-bundle-identifier com.keystow.app --add-data 'models/faster-whisper-base:models/faster-whisper-base' --add-data 'build-licenses:licenses' --add-data 'keystow/fonts:keystow/fonts' --paths installer/stubs --additional-hooks-dir installer/hooks --exclude-module PIL --exclude-module hf_xet --collect-all faster_whisper --collect-all ctranslate2 run_keystow.py
          test -x dist/KeyStow.app/Contents/MacOS/KeyStow
          # Nothing from FFmpeg may ship, and pynput must be replaceable source.
          if find dist/KeyStow.app -type f \( -name 'libavcodec*' -o -name 'libavformat*' -o -name 'libx264*' -o -name 'libx265*' \) | grep -q .; then
            echo "FFmpeg libraries in the build"; exit 1
          fi
          test -n "$(find dist/KeyStow.app -type f -path '*pynput/__init__.py' -print -quit)"
          test -n "$(find dist/KeyStow.app -type f -path '*models/faster-whisper-base/model.bin' -print -quit)"
          test -n "$(find dist/KeyStow.app -type f -path '*licenses/THIRD-PARTY-NOTICES.txt' -print -quit)"
      # macOS gives an app no microphone audio, and shows no permission prompt,
      # unless Info.plist says why the app wants the microphone. The libraries
      # inside need macOS 14, so Info.plist says that too and an older macOS
      # refuses with a clear message instead of the app failing to open.
      # Editing Info.plist breaks the signature PyInstaller applied, and Apple
      # Silicon refuses to open an app with a broken signature: edit first,
      # sign afterwards, and do not touch the bundle again.
      - name: Set the version, minimum macOS and microphone reason, then ad-hoc sign with no further bundle edits
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, plistlib
          path = 'dist/KeyStow.app/Contents/Info.plist'
          with open(path, 'rb') as handle:
              info = plistlib.load(handle)
          info.update(
              CFBundleShortVersionString=os.environ['VERSION'],
              CFBundleVersion=os.environ['VERSION'],
              CFBundleIdentifier='com.keystow.app',
              LSMinimumSystemVersion='14.0',
              NSMicrophoneUsageDescription='KeyStow listens while you hold your shortcut and turns your speech into text on this Mac. Audio is not saved or sent anywhere.',
          )
          with open(path, 'wb') as handle:
              plistlib.dump(info, handle)
          PY
          mkdir -p release-evidence
          codesign --force --deep --sign - --preserve-metadata=entitlements dist/KeyStow.app
          codesign --verify --deep --strict --verbose=2 dist/KeyStow.app 2>&1 | tee release-evidence/app-signature-verify.txt
          codesign -d --verbose=4 dist/KeyStow.app 2>&1 | tee release-evidence/app-signature-details.txt
          file dist/KeyStow.app/Contents/MacOS/KeyStow | tee release-evidence/architecture.txt
      # Both checks run a copy, so the bundle that ships is never opened before
      # packaging. The first one stops the release if it fails.
      - name: Signed app copy must load its own model and recognise the speech sample
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app-check"
          ditto dist/KeyStow.app "$RUNNER_TEMP/app-check/KeyStow.app"
          python installer/verify_self_test.py "$RUNNER_TEMP/app-check/KeyStow.app/Contents/MacOS/KeyStow" release-evidence
      # The hosted Mac cannot always drive the window, so a failure here is
      # recorded and reported without stopping the build.
      - name: Signed app copy should open, refuse a second copy and close cleanly
        id: mac_launch
        continue-on-error: true
        run: python installer/verify_candidate_processes.py "$RUNNER_TEMP/app-check/KeyStow.app/Contents/MacOS/KeyStow" release-evidence
      - name: Record the Mac launch check result
        if: always()
        env:
          OUTCOME: ${{ steps.mac_launch.outcome }}
        run: |
          mkdir -p release-evidence
          echo "Mac launch check on the signed app copy - $OUTCOME" | tee -a "$GITHUB_STEP_SUMMARY" release-evidence/mac-launch-check.txt
      - name: Package the DMG and verify the app inside the mounted image
        run: |
          set -euo pipefail
          mkdir -p dist/dmg
          ditto dist/KeyStow.app dist/dmg/KeyStow.app
          ln -s /Applications dist/dmg/Applications
          codesign --verify --deep --strict dist/dmg/KeyStow.app
          hdiutil create -volname KeyStow -srcfolder dist/dmg -ov -format UDZO dist/KeyStowMac.dmg
          hdiutil verify dist/KeyStowMac.dmg 2>&1 | tee release-evidence/dmg-verify.txt
          mkdir -p "$RUNNER_TEMP/keystow-mounted"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/keystow-mounted" dist/KeyStowMac.dmg
          trap 'hdiutil detach "$RUNNER_TEMP/keystow-mounted"' EXIT
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/keystow-mounted/KeyStow.app" 2>&1 | tee release-evidence/mounted-app-signature-verify.txt
          python - "$RUNNER_TEMP/keystow-mounted/KeyStow.app/Contents/Info.plist" <<'PY' | tee release-evidence/mounted-app-info.txt
          import os, plistlib, sys
          with open(sys.argv[1], 'rb') as handle:
              info = plistlib.load(handle)
          assert info['CFBundleShortVersionString'] == os.environ['VERSION'], info['CFBundleShortVersionString']
          assert info.get('NSMicrophoneUsageDescription'), 'the microphone reason is missing'
          assert info.get('LSMinimumSystemVersion') == '14.0', info.get('LSMinimumSystemVersion')
          print('version', info['CFBundleShortVersionString'])
          print('identifier', info['CFBundleIdentifier'])
          print('minimum macOS', info['LSMinimumSystemVersion'])
          print('microphone reason present')
          PY
          test -n "$(find "$RUNNER_TEMP/keystow-mounted/KeyStow.app" -type f -path '*licenses/THIRD-PARTY-NOTICES.txt' -print -quit)"
      - name: Stage Mac installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-installer
          path: dist/KeyStowMac.dmg
          retention-days: 14
          if-no-files-found: error
      - name: Keep the signing and app check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-evidence
          path: release-evidence/
          retention-days: 30
          if-no-files-found: ignore

  publish:
    name: Publish the release
    if: github.event_name == 'workflow_dispatch'
    needs: [check, build-windows, build-mac]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download this run's Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: installers
      - name: Download this run's Mac installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mac-installer
          path: installers
      - name: Check both installers arrived
        run: |
          set -euo pipefail
          test -s installers/KeyStowSetup.exe
          test -s installers/KeyStowMac.dmg
          sha256sum installers/KeyStowSetup.exe installers/KeyStowMac.dmg | tee -a "$GITHUB_STEP_SUMMARY"
      # Upload as a draft first. The release only becomes public after GitHub's
      # stored size and SHA-256 for each file match the files built in this run.
      # Earlier releases and their download links are never touched. The notes
      # are this version's section of CHANGELOG.md, followed by the SHA-256 of
      # each installer.
      - name: Upload as a draft, compare what GitHub stored, then publish
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A release for $tag already exists; refusing to overwrite it"
            exit 1
          fi
          python3 installer/release_notes.py "$VERSION" > notes.md
          {
            printf '\n\nSHA-256 of the installers:\n\n'
            (cd installers && sha256sum KeyStowSetup.exe KeyStowMac.dmg | sed 's/^/    /')
          } >> notes.md
          published=0
          cleanup() {
            if [ "$published" = 0 ]; then
              echo "Removing the unpublished draft"
              gh release delete "$tag" --yes || true
            fi
          }
          trap cleanup EXIT
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "KeyStow $tag" --notes-file notes.md installers/KeyStowSetup.exe installers/KeyStowMac.dmg
          gh api "repos/$GH_REPO/releases?per_page=30" > releases.json
          python3 installer/verify_release_assets.py releases.json installers "$tag"
          # Always a pre-release: "latest" (what the website serves) is set only
          # by the promote workflow, after the installers were tried by hand.
          gh release edit "$tag" --draft=false --prerelease --latest=false
          test "$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .prerelease)" = true
          echo "Published $tag as a pre-release from $GITHUB_SHA. The website still serves the previous release. Try both installers on real computers, then run the Promote a tested pre-release workflow." | tee -a "$GITHUB_STEP_SUMMARY"
          published=1
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
