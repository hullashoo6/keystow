name: Private single-instance repair validation - NO PUBLICATION
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  private-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 436e575a97fb4967bbddf5d126f448ca1f02f17e
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Wrap unchanged corrected bytes, install, test, uninstall and privately stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          import pathlib,subprocess,hashlib,urllib.request,json,zipfile,os,datetime,shutil,winreg
          root=pathlib.Path.cwd(); ev=root/'installer-evidence';ev.mkdir(); stage=root/'installer-stage';stage.mkdir();downloads=root/'downloads';downloads.mkdir()
          def sha(b):return hashlib.sha256(b).hexdigest()
          def api(path):return json.loads(subprocess.check_output(['gh','api',path]))
          import base64,time
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='436e575a97fb4967bbddf5d126f448ca1f02f17e'
          patch_files = {'keystow/single_instance.py': '', 'keystow/ui.py': '', 'tests/test_single_instance.py': '', 'installer/native_candidate/runtime_hook.py': ''}
          for n,b64 in patch_files.items():
              p=root/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(b64))
          source_identity={'base_source_commit':'436e575a97fb4967bbddf5d126f448ca1f02f17e','candidate_recipe_commit':os.environ['GITHUB_SHA'],'patched_files':{n:sha((root/n).read_bytes()) for n in patch_files},'owner_duplicate_cause_proven':False}
          (ev/'candidate-source-identity.json').write_text(json.dumps(source_identity,indent=2))
          # Rebuild with the same pinned native recipe, then wrap the exact new bytes.
          builder_path=root/'installer/native_candidate/build_candidate.py'
          bs=builder_path.read_text();bs=bs.replace('    native_inventory(dist,exe)','    for removed in dist.rglob("cudnn64_9.dll"): removed.unlink()\n    native_inventory(dist,exe)',1)
          builder_path.write_text(bs)
          import importlib.util,sys
          sys.path.insert(0,str(builder_path.parent))
          spec=importlib.util.spec_from_file_location('candidate_builder',builder_path);builder=importlib.util.module_from_spec(spec);spec.loader.exec_module(builder)
          builder.main()
          shutil.copytree(root/'candidate-evidence',ev/'rebuild-evidence',ignore=shutil.ignore_patterns('*.zip','*.tar.gz'))
          draft=api('repos/hullashoo6/keystow/releases/452231425');assert draft['draft']
          expected={770297672:(242077910,'eb01efe84f8c5bf64e0873e69866e4ed82184353e2b8af096f6d735a83ac0972'),770303219:(2375250,'04fcc165a85add9aaa05c7708274a3413299db18a3a9c3b63a11ad2d79623887'),770335028:(185323,'2886b5c0020e4574079232c70d14c9eeccc05cdbae13505818ff1216d966a795'),770356114:(20930485,'d6c27acbdd7ff00d47135a7f3d09a89ee91148d170200a29548b144f1134d87f')}
          payload=None
          for ident,(size,digest) in expected.items():
              a=next(x for x in draft['assets'] if x['id']==ident);assert a['size']==size and a['digest']=='sha256:'+digest
              req=urllib.request.Request(a['url'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/octet-stream'})
              b=urllib.request.urlopen(req,timeout=180).read();assert len(b)==size and sha(b)==digest
              path=downloads/a['name'];path.write_bytes(b)
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  if ident==770297672:z.extractall(stage);payload=path
                  else:z.extractall(stage/'KeyStowCandidate'/'ThirdParty'/str(ident))
          app=stage/'KeyStowCandidate';assert (app/'KeyStowCandidate.exe').exists()
          old_app=app;new_dist=root/'candidate-work/dist/KeyStowCandidate'
          # Retained native dependencies must be byte-identical; only the app exe may change.
          native_compared=[]
          for p in old_app.rglob('*'):
              if p.is_file() and p.suffix.lower() in ('.dll','.pyd'):
                  rel=p.relative_to(old_app);q=new_dist/rel;assert q.exists() and q.read_bytes()==p.read_bytes(),str(rel);native_compared.append(str(rel))
          temp=root/'retained-notice-corpus';shutil.move(str(app/'ThirdParty'),str(temp));shutil.rmtree(app)
          shutil.copytree(new_dist,app);shutil.move(str(temp),str(app/'ThirdParty'))
          (app/'NOT-FOR-RELEASE.txt').unlink(missing_ok=True)
          source_dir=app/'ThirdParty'/'Single-instance-candidate-source';source_dir.mkdir()
          for n in ['keystow','installer','tests']:
              shutil.copytree(root/n,source_dir/n,ignore=shutil.ignore_patterns('__pycache__','*.pyc'))
          shutil.copy2(root/'run_keystow.py',source_dir/'run_keystow.py');shutil.copy2(root/'requirements.txt',source_dir/'requirements.txt')
          (source_dir/'CANDIDATE-SOURCE-IDENTITY.json').write_text(json.dumps(source_identity,indent=2))
          (ev/'retained-native-identity.json').write_text(json.dumps({'files':native_compared,'all_unchanged':True},indent=2))
          sources=json.loads((app/'ThirdParty'/'770303219'/'EXACT-SOURCE-DOWNLOADS.json').read_text())
          for src in sources:
              if 'download.qt.io' not in src['url']:continue
              b=urllib.request.urlopen(src['url'],timeout=180).read();assert len(b)==src['bytes'] and sha(b)==src['sha256']
              d=app/'ThirdParty'/'corresponding-source';d.mkdir(exist_ok=True);(d/src['url'].split('/')[-1]).write_bytes(b)
          # Independently acquire the runtime from Intel's exact NuGet redistribution package.
          nuget_url='https://www.nuget.org/api/v2/package/intelopenmp.redist.win/2025.3.0.640'
          nb=urllib.request.urlopen(nuget_url,timeout=180).read();assert sha(nb)=='a4212c4aec3e528864d56d8b0c87103cd5c21a888d1985124909a1f85624a449'
          nd=app/'ThirdParty'/'Intel-OpenMP-NuGet-Distribution';nd.mkdir()
          (nd/'intelopenmp.redist.win.2025.3.0.640.nupkg').write_bytes(nb)
          import io
          with zipfile.ZipFile(io.BytesIO(nb)) as nz:
              assert nz.testzip() is None
              runtime=nz.read('runtimes/win-x64/native/libiomp5md.dll');rp=app/'_internal'/'ctranslate2'/'libiomp5md.dll';assert runtime==rp.read_bytes();assert sha(runtime)=='982233366b0afcda1e0f55a0b134097e35b779613f54ddb69e685e6cd06b755f';rp.write_bytes(runtime)
              for n in ['license.txt','intelopenmp.redist.win.nuspec','share/doc/compiler/licensing/openmp/third-party-programs.txt']:
                  d=nd/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(nz.read(n))
          basis={'component':'Intel OpenMP libiomp5md.dll','source':nuget_url,'package_sha256':sha(nb),'runtime_bytes':len(runtime),'runtime_sha256':sha(runtime),'identical_to_prior_payload':True,'terms':'Intel Simplified Software License Version October 2022','scope':'This runtime only; independent third-party terms remain applicable.'}
          (nd/'COMPONENT-SOURCE-BASIS.json').write_text(json.dumps(basis,indent=2))
          hist=app/'ThirdParty'/'Historical-private-test-records';hist.mkdir()
          for relative in ['770303219/COMPONENT-MAPPING-AND-LIMITS.md','770303219/READ-ME-FIRST.md']:
              old=app/'ThirdParty'/relative
              if old.exists():shutil.move(str(old),str(hist/old.name))
          (nd/'COMPONENT-TERMS.txt').write_text('This unmodified Intel OpenMP runtime is distributed from Intel NuGet intelopenmp.redist.win 2025.3.0.640 under its supplied Intel Simplified Software License October 2022. Intel Corporation copyright, full terms and nested notices are retained here. Do not modify, reverse engineer, decompile or disassemble the Intel software contrary to its terms. Do not use Intel or supplier names as endorsement. Third-party software remains governed by its separate terms. These Intel restrictions do not relicense KeyStow source or impose a blanket restriction on LGPL-covered components. Historical alternative-source investigations are retained separately and do not override this component source statement. No claim of Intel certification or performance guarantee.\n')
          inno_url='https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe'
          b=urllib.request.urlopen(inno_url,timeout=120).read();assert sha(b)=='f3c42116542c4cc57263c5ba6c4feabfc49fe771f2f98a79d2f7628b8762723b';inno=downloads/'inno.exe';inno.write_bytes(b)
          subprocess.run([str(inno),'/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-'],check=True)
          (app/'INSTALL-README.txt').write_text('KeyStow Windows x64 test installer. Unsigned, optional noise suppression unavailable, no cuDNN. Single-instance startup guard: second guarded launch exits before dictation starts. Quit all older unguarded KeyStow copies before testing. This does not prove the cause of the reported duplicate paste. Real-device microphone, physical hotkey, paste and tray acceptance remain pending. New defaults Right Ctrl and hold-to-talk; explicit existing preferences remain. Close hides to tray; double-click tray to reopen; Quit exits. No installer-created start-at-login. Keep Notepad focused during dictation. Clipboard restoration is text-only best effort. If Windows security blocks it, stop and report the warning, do not disable protection.\n\nIntel OpenMP libiomp5md.dll is sourced directly from Intel NuGet intelopenmp.redist.win 2025.3.0.640, unmodified and byte-identical to the prior runtime, under the package-supplied Intel Simplified Software License October 2022. Full package, copyright, license, nested notices and source basis are in ThirdParty/Intel-OpenMP-NuGet-Distribution. Its component-specific restrictions apply to Intel software, not to all KeyStow or LGPL components. Other libraries and model weights retain their own licenses. KeyStow source alone is MIT. Complete supplied sources and notices are under ThirdParty; LGPL-compatible component replacement/debugging is not prohibited by KeyStow terms. Historical private-test investigations are separately labelled. Inno Setup 6.4.3 used under its supplied license. This is an isolated test install, not a verified production upgrade.\n')
          license_url='https://raw.githubusercontent.com/jrsoftware/issrc/is-6_4_3/license.txt';(app/'ThirdParty'/'Inno-Setup-6.4.3-LICENSE.txt').write_bytes(urllib.request.urlopen(license_url).read())
          # Exact expected payload manifest excludes only added source/notice materials.
          manifest={str(p.relative_to(app)):sha(p.read_bytes()) for p in app.rglob('*') if p.is_file() and not str(p.relative_to(app)).startswith('ThirdParty')}
          iss='''[Setup]
          AppId=KeyStowPrivateTest436e575
          AppName=KeyStow Private Test
          AppVersion=1.0.2.2
          AppPublisher=KeyStow
          DefaultDirName={localappdata}\\Programs\\KeyStowPrivateTest
          DefaultGroupName=KeyStow Private Test
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=output
          OutputBaseFilename=KeyStow-Windows-Test-SingleInstance-20261120
          Compression=lzma2/fast
          SolidCompression=yes
          WizardStyle=modern
          DisableProgramGroupPage=yes
          UninstallDisplayName=KeyStow Private Test
          [Files]
          Source: "installer-stage\\KeyStowCandidate\\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\\KeyStow Private Test"; Filename: "{app}\\KeyStowCandidate.exe"
          Name: "{group}\\Uninstall KeyStow Private Test"; Filename: "{uninstallexe}"
          [Run]
          Filename: "{app}\\KeyStowCandidate.exe"; Description: "Launch KeyStow Private Test"; Flags: nowait postinstall skipifsilent unchecked
          '''
          script=root/'private-setup.iss';script.write_text('\n'.join(x.strip() for x in iss.splitlines()))
          iscc=pathlib.Path(os.environ.get('ProgramFiles(x86)','C:/Program Files (x86)'))/'Inno Setup 6'/'ISCC.exe';assert iscc.exists()
          with (ev/'compile.txt').open('w') as f:subprocess.run([str(iscc),str(script)],stdout=f,stderr=subprocess.STDOUT,check=True)
          setup=root/'output'/'KeyStow-Windows-Test-SingleInstance-20261120.exe';assert setup.exists()
          install=root/'installed private test é';install.mkdir();(install/'unrelated-user-file.txt').write_text('preserve me')
          subprocess.run([str(setup),'/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/DIR='+str(install),'/LOG='+str(ev/'install.log')],check=True)
          actual={n:sha((install/n).read_bytes()) for n in manifest};assert actual==manifest
          notice_manifest={str(f.relative_to(app)):sha(f.read_bytes()) for f in app.rglob('*') if f.is_file() and (str(f.relative_to(app)).startswith('ThirdParty') or f.name=='INSTALL-README.txt')};assert all(sha((install/n).read_bytes())==h for n,h in notice_manifest.items())
          # Installer must not add a Run entry; do not modify any pre-existing entry.
          value=None
          try:
              with winreg.OpenKey(winreg.HKEY_CURRENT_USER,r'Software\Microsoft\Windows\CurrentVersion\Run') as k:
                  try:value=winreg.QueryValueEx(k,'KeyStowPrivateTest')[0]
                  except FileNotFoundError:pass
          except FileNotFoundError:pass
          assert value is None
          env=os.environ.copy();env.pop('GH_TOKEN',None);env.update(QT_QPA_PLATFORM='offscreen',PYNPUT_BACKEND='dummy',HF_HUB_OFFLINE='1',TRANSFORMERS_OFFLINE='1',KEYSTOW_MODEL='base',QT_QPA_FONTDIR=str(pathlib.Path(os.environ['WINDIR'])/'Fonts'),CANDIDATE_EVIDENCE_DIR=str(ev))
          codes={}
          for label,arg in [('installed-inference','--candidate-probe'),('installed-integrity','--candidate-code-substitution'),('installed-entrypoint','--candidate-ui-smoke')]:
              with (ev/(label+'.txt')).open('w') as f:r=subprocess.run([str(install/'KeyStowCandidate.exe'),arg],env=env,stdout=f,stderr=subprocess.STDOUT,timeout=180)
              codes[label]=r.returncode;assert r.returncode==0,label
          # Runs in the installer's Python block, before uninstalling the exact setup.
          life=ev/'frozen-instance-lifecycle';life.mkdir()
          life_home=root/'instance profile é';life_home.mkdir();(life_home/'.keystow').mkdir()
          settings_sentinel=b'{"activation_mode":"hold","hotkey":"ctrl_r","autostart_initialized":true,"noise_suppression":false}'
          (life_home/'.keystow'/'settings.json').write_bytes(settings_sentinel)
          life_env=dict(env,HOME=str(life_home),USERPROFILE=str(life_home),APPDATA=str(life_home/'AppData/Roaming'),LOCALAPPDATA=str(life_home/'AppData/Local'),CANDIDATE_EVIDENCE_DIR=str(life))
          def primary():
              (life/'instance-primary-ready.json').unlink(missing_ok=True);(life/'instance-stop').unlink(missing_ok=True)
              f=(life/('process-'+str(len(list(life.glob('process-*.txt'))))+'.txt')).open('w')
              p=subprocess.Popen([str(install/'KeyStowCandidate.exe'),'--candidate-instance-lifecycle'],env=life_env,stdout=f,stderr=subprocess.STDOUT)
              deadline=time.monotonic()+100
              while not (life/'instance-primary-ready.json').exists() and p.poll() is None and time.monotonic()<deadline:time.sleep(.2)
              assert p.poll() is None and (life/'instance-primary-ready.json').exists(),'primary did not reach Ready'
              return p,f
          p,f=primary()
          try:
              duplicates=[]
              for _ in range(3):
                  start=time.monotonic();r=subprocess.run([str(install/'KeyStowCandidate.exe'),'--candidate-instance-lifecycle'],env=life_env,capture_output=True,text=True,timeout=25)
                  duplicates.append({'exit':r.returncode,'seconds':time.monotonic()-start});assert r.returncode==0 and p.poll() is None
              (life/'instance-stop').touch();assert p.wait(timeout=25)==0
          finally:
              if p.poll() is None:p.kill();p.wait(timeout=10)
              f.close()
          p,f=primary()
          try:p.kill();p.wait(timeout=10)
          finally:f.close()
          p,f=primary()
          try:(life/'instance-stop').touch();assert p.wait(timeout=25)==0
          finally:
              if p.poll() is None:p.kill();p.wait(timeout=10)
              f.close()
          assert (life_home/'.keystow'/'settings.json').read_bytes()==settings_sentinel
          assert not (life_home/'.keystow'/'dictation-instance.lock').exists()
          (ev/'frozen-instance-lifecycle.json').write_text(json.dumps({'second_launch_exits':duplicates,'primary_remains_running':True,'clean_quit_restart':True,'forced_exit_restart':True,'settings_preserved':True,'actual_installed_executable':True,'physical_device_acceptance':False,'legacy_unguarded_instances_protected':False},indent=2))
          subprocess.run([str(install/'unins000.exe'),'/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG='+str(ev/'uninstall.log')],check=True)
          assert not (install/'KeyStowCandidate.exe').exists() and not (install/'_internal').exists();assert (install/'unrelated-user-file.txt').read_text()=='preserve me'
          verdict={'source_commit':'436e575a97fb4967bbddf5d126f448ca1f02f17e','payload_sha256':expected[770297672][1],'installed_payload_files_equal':len(manifest),'candidate_source':source_identity,'single_instance_native_lifecycle_pass':True,'setup_bytes':setup.stat().st_size,'setup_sha256':sha(setup.read_bytes()),'install_hash_check':True,'notice_source_file_hashes_unchanged':len(notice_manifest),'unrelated_user_file_preserved':True,'spaces_nonascii_install_path':True,'uninstall_check':True,'no_autostart_registration':True,'tests':codes,'device_acceptance':False,'rights_clearance':False,'openmp_nuget_origin_verified':basis,'unsigned':True,'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          (ev/'installer-verdict.json').write_text(json.dumps(verdict,indent=2));shutil.copy(script,ev/'private-setup.iss')
          # New private staging only. Do not mutate either prior draft or publish.
          existing=api('repos/hullashoo6/keystow/releases');assert not any(x['tag_name']=='private-single-instance-20261120' for x in existing),'Do not duplicate private staging'
          rel_data={'tag_name':'private-single-instance-20261120','target_commitish':os.environ['GITHUB_SHA'],'name':'PRIVATE Windows single-instance repair candidate - NOT PUBLISHED','draft':True,'prerelease':True,'body':'Private candidate only. Source base436e575 plus exact source patches embedded in the pinned candidate workflow recipe; source files and identities are included with the installer. Process-level singleton guard and Windows-test copy correction only. Earlier duplicate-insertion cause on owner machine remains unproven. Native installed process lifecycle and exact installer checks required before staging. No public release, production upgrade assurance or owner-device acceptance.'}
          req=urllib.request.Request('https://api.github.com/repos/hullashoo6/keystow/releases',data=json.dumps(rel_data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'},method='POST');rel=json.load(urllib.request.urlopen(req));assert rel['draft'] and not rel['assets']
          upload_url=rel['upload_url'].split('{')[0]+'?name='+setup.name
          req=urllib.request.Request(upload_url,data=setup.read_bytes(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/octet-stream'},method='POST')
          asset=json.load(urllib.request.urlopen(req,timeout=180));assert asset['state']=='uploaded' and asset['size']==verdict['setup_bytes']
          req=urllib.request.Request(asset['url'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/octet-stream'});b=urllib.request.urlopen(req,timeout=180).read();assert len(b)==verdict['setup_bytes'] and sha(b)==verdict['setup_sha256']
          verdict.update(draft_id=rel['id'],draft_url=rel['html_url'],asset_id=asset['id'],download_url=asset['browser_download_url'],actual_authenticated_download_rehash=True);(ev/'installer-verdict.json').write_text(json.dumps(verdict,indent=2));print(json.dumps(verdict,indent=2))
          PYCODE
      - name: Preserve bounded metadata only, never setup binary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: single-instance-installer-validation-evidence
          path: installer-evidence/
          retention-days: 1
          if-no-files-found: error
