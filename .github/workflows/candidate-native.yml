name: KeyStow candidate native evidence - NOT FOR RELEASE

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact candidate commit SHA
        required: true
        type: string
      candidate_label:
        description: Must be NOT-FOR-RELEASE
        required: true
        default: NOT-FOR-RELEASE
        type: string

permissions:
  contents: read

concurrency:
  group: keystow-candidate-native
  cancel-in-progress: false

jobs:
  native:
    name: Candidate evidence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate candidate identity before checkout or dependencies
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CANDIDATE_LABEL: ${{ inputs.candidate_label }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os,re
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['EXPECTED_SHA'])
          assert os.environ['EXPECTED_SHA']==os.environ['ACTUAL_SHA']
          assert os.environ['ACTUAL_REF']=='refs/heads/candidate/numpy-native-20261119'
          assert os.environ['CANDIDATE_LABEL']=='NOT-FOR-RELEASE'
          print('Exact candidate identity PASS; no release authority implied')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build and inspect native candidate, with no publisher
        run: python installer/native_candidate/build_candidate.py
      - name: Seal bounded safe evidence even after a target failure
        if: always()
        id: seal
        run: python installer/native_candidate/build_candidate.py --seal
      - name: Store one-day diagnostic metadata only, no binary
        if: always() && steps.seal.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NOT-FOR-RELEASE-${{ matrix.os }}-${{ github.sha }}
          path: candidate-upload/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: false
