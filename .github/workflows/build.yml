name: Build Windows installer

on:
  push:
    branches: [main]
    paths: ['run_murmur.py', 'murmur/**', 'requirements.txt', 'installer/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Generate app icons
        run: python installer/make_icons.py
      - name: Fetch RNNoise native library
        run: |
          pip download pyrnnoise==0.4.5 --no-deps --platform win_amd64 --python-version 3.11 --only-binary :all: -d vendor_dl
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('vendor_dl/*.whl')[0]); z.extract('pyrnnoise-0.4.5.data/purelib/pyrnnoise/rnnoise.dll','vendor_dl')"
          copy vendor_dl\pyrnnoise-0.4.5.data\purelib\pyrnnoise\rnnoise.dll murmur\vendor\rnnoise.dll
      - name: Download bundled Whisper base model
        run: |
          pip install huggingface-hub
          huggingface-cli download Systran/faster-whisper-base --local-dir models/faster-whisper-base
      - name: Build Murmur.exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name Murmur --icon installer\murmur.ico --add-data "models/faster-whisper-base;models/faster-whisper-base" --add-binary "murmur/vendor/rnnoise.dll;murmur/vendor" --collect-all faster_whisper --collect-all ctranslate2 run_murmur.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc installer\setup.iss
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 installer\installer\MurmurSetup.exe --clobber || gh release create v1.0.0 installer\installer\MurmurSetup.exe --title "Murmur v1.0.0" --notes "First release: push-to-talk voice typing for Windows. Download MurmurSetup.exe, run it, and Murmur appears in your tray. Hold Right Ctrl, speak, release."

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Generate app icons
        run: python installer/make_icons.py
      - name: Download bundled Whisper base model
        run: |
          pip install huggingface-hub
          huggingface-cli download Systran/faster-whisper-base --local-dir models/faster-whisper-base
      - name: Build Murmur.app with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name Murmur --icon installer/murmur.icns --add-data "models/faster-whisper-base:models/faster-whisper-base" --collect-all faster_whisper --collect-all ctranslate2 run_murmur.py
      - name: Create DMG
        run: |
          mkdir -p dist/dmg
          cp -R dist/Murmur.app dist/dmg/
          hdiutil create -volname Murmur -srcfolder dist/dmg -ov -format UDZO dist/MurmurMac.dmg
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 dist/MurmurMac.dmg --clobber || gh release create v1.0.0 dist/MurmurMac.dmg --title "Murmur v1.0.0" --notes "Voice typing for Windows and Mac: local, private, no account. Windows: run MurmurSetup.exe. Mac (Apple Silicon): open MurmurMac.dmg, drag to Applications, right-click -> Open on first launch, then allow Microphone and Accessibility access."
