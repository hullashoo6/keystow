name: Verify existing v1.0.2 draft (no publication)
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: keystow-verify-existing-draft-450899801
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'hullashoo6/keystow' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Retrieve exact existing metadata and bytes (GET only)
        id: retrieve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/staged evidence/draft-downloads
          API=repos/hullashoo6/keystow
          gh api --method GET -H 'Accept: application/vnd.github.raw+json' "$API/contents/installer/verify_release_assets.py?ref=09abd933ea675ce71b50f947782286c8c2d3ac48" > evidence/verify_release_assets.py
          gh api --method GET "$API/releases/450899801" > evidence/draft.json
          gh api --method GET "$API/actions/runs/44461661069" > evidence/run.json
          gh api --method GET "$API/git/ref/tags/v1.0.2" > evidence/tag.json
          for id in 14500582181 14499403856; do
            gh api --method GET "$API/actions/artifacts/$id" > "evidence/$id.json"
            gh api --method GET "$API/actions/artifacts/$id/zip" > "evidence/$id.zip"
          done
          gh api --method GET -H 'Accept: application/octet-stream' "$API/releases/assets/766296496" > evidence/draft-downloads/KeyStowMac.dmg
          gh api --method GET -H 'Accept: application/octet-stream' "$API/releases/assets/766296498" > evidence/draft-downloads/KeyStowSetup.exe
          touch evidence/retrieval-ok
      - name: Run unchanged verifier and independent byte gates
        if: always()
        shell: python
        run: |
          EXPECTED_NOTES='Local voice typing for Windows and Apple Silicon Mac. Recovery update: paste-key cleanup and conditional clipboard restoration, best-effort local diagnostic logging, retryable login registration, safe Mac login-file serialization and replacement, and bounded startup-storage recovery with a visible warning and retry after user repair. Hold-to-speak remains the default for uncustomized installs; explicit modes and legacy custom keys are preserved. Built and component-tested; installed microphone, global shortcut, paste and real Mac login acceptance remain unverified. Clipboard insertion remains focus-dependent and restoration preserves text only. Download the installer for your platform. These downloads provide the installers directly. No payment is collected.'
          import hashlib,json,os,subprocess,sys,zipfile
          from pathlib import Path
          P=Path('evidence'); gates={}; out={'schema':'keystow-draft-gates-v1','pass':False,'release_id':450899801,'source_run_id':44461661069,'source_sha':'09abd933ea675ce71b50f947782286c8c2d3ac48','verification_run_id':os.environ['GITHUB_RUN_ID'],'verification_workflow_sha':os.environ['GITHUB_SHA'],'gates':gates}
          stage='retrieval'; detail=[]
          try:
              assert (P/'retrieval-ok').exists()
              stage='verifier_source'; assert hashlib.sha256((P/'verify_release_assets.py').read_bytes()).hexdigest()=='c67c4fbc47bafb9f124fcd6003a2b5bcaa24337c959606dbd2400eded255c29c'; gates[stage]='pass'
              stage='source_run'; run=json.loads((P/'run.json').read_text()); assert run['id']==44461661069 and run['head_sha']==out['source_sha'] and run['run_attempt']==1; gates[stage]='pass'
              stage='tag'; tag=json.loads((P/'tag.json').read_text()); assert tag['object']['type']=='commit' and tag['object']['sha']==out['source_sha']; gates[stage]='pass'
              stage='draft_identity'; draft=json.loads((P/'draft.json').read_text()); assert draft['id']==450899801 and draft['draft'] is True and draft['tag_name']=='v1.0.2' and draft['prerelease'] is False and draft['name']=='KeyStow v1.0.2'; assert draft['body']==EXPECTED_NOTES; out['target_commitish']=draft['target_commitish']; assert draft['target_commitish'] in ('main',out['source_sha']); gates[stage]='pass'
              specs=[('14500582181','KeyStowSetup.exe',766296498,291807673,'6c72dd1801dc1fac1bce3ad1b051898ecae6423c5a5344706520299a488c922b','77db38bc67bcf6dc2d02685331d0ce3386b9aaefb225f6b3033700f883aaaeaf'),('14499403856','KeyStowMac.dmg',766296496,234260074,'fbc86c30e701d2fde5585113d8972d86672b4b72b5e25db15c313d494228b15a','ed2cc4c1ce7782882fbaabce0736b5b105740de520d03ec388db1395f01511ea')]
              stage='asset_identity'; assert len(draft['assets'])==2 and {a['name']:a['id'] for a in draft['assets']}=={s[1]:s[2] for s in specs}; gates[stage]='pass'
              for aid,name,assetid,arsize,arhash,ihash in specs:
                  stage='artifact_'+aid; meta=json.loads((P/(aid+'.json')).read_text()); assert meta['id']==int(aid) and meta['workflow_run']['id']==44461661069 and meta['workflow_run']['head_sha']==out['source_sha'] and meta['expired'] is False and meta['digest']=='sha256:'+arhash and meta['size_in_bytes']==arsize
                  archive=P/(aid+'.zip'); b=archive.read_bytes(); assert len(b)==arsize and hashlib.sha256(b).hexdigest()==arhash
                  with zipfile.ZipFile(archive) as z:
                      members=[i for i in z.infolist() if not i.is_dir()]; assert len(members)==1 and members[0].filename==name; b=z.read(members[0])
                  assert b and hashlib.sha256(b).hexdigest()==ihash; (P/'staged'/name).write_bytes(b); gates[stage]='pass'
                  stage='draft_payload_'+name; d=(P/'draft-downloads'/name).read_bytes(); assert d==b; gates[stage]='pass'; detail.append({'name':name,'artifact_id':int(aid),'asset_id':assetid,'archive_bytes':arsize,'archive_sha256':arhash,'installer_bytes':len(b),'installer_sha256':ihash})
              stage='unchanged_verifier'; subprocess.run([sys.executable,str(P/'verify_release_assets.py'),str(P/'draft.json'),str(P/'staged')],check=True); gates[stage]='pass'; out['pass']=True
          except Exception as e:
              gates[stage]='fail'; out['error_category']=type(e).__name__
          out['payloads']=detail
          (P/'result.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2)); sys.exit(0 if out['pass'] else 1)
      - name: Preserve only small gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-450899801-verification-result
          path: evidence/result.json
          if-no-files-found: error
          retention-days: 1
