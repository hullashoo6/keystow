name: Build KeyStow installers

on:
  push:
    branches: [main]
    paths: ['run_keystow.py', 'keystow/**', 'requirements.txt', 'installer/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Generate app icons
        run: python installer/make_icons.py
      - name: Fetch RNNoise native library
        run: |
          pip download pyrnnoise==0.4.5 --no-deps --platform win_amd64 --python-version 3.11 --only-binary :all: -d vendor_dl
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('vendor_dl/*.whl')[0]); z.extract('pyrnnoise-0.4.5.data/purelib/pyrnnoise/rnnoise.dll','vendor_dl')"
          copy vendor_dl\pyrnnoise-0.4.5.data\purelib\pyrnnoise\rnnoise.dll keystow\vendor\rnnoise.dll
      - name: Download bundled Whisper base model
        run: |
          pip install huggingface-hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-base', local_dir='models/faster-whisper-base')"
      - name: Build KeyStow.exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name KeyStow --icon installer\keystow.ico --add-data "models/faster-whisper-base;models/faster-whisper-base" --add-binary "keystow/vendor/rnnoise.dll;keystow/vendor" --collect-all faster_whisper --collect-all ctranslate2 run_keystow.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc installer\setup.iss
      - name: Stage Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/installer/KeyStowSetup.exe
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Generate app icons
        run: python installer/make_icons.py
      - name: Download bundled Whisper base model
        run: |
          pip install huggingface-hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-base', local_dir='models/faster-whisper-base')"
      - name: Build KeyStow.app with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name KeyStow --icon installer/keystow.icns --add-data "models/faster-whisper-base:models/faster-whisper-base" --collect-all faster_whisper --collect-all ctranslate2 run_keystow.py
      - name: Set macOS bundle version
        run: |
          python -c "import plistlib; p='dist/KeyStow.app/Contents/Info.plist'; d=plistlib.load(open(p,'rb')); d.update(CFBundleShortVersionString='1.0.2', CFBundleVersion='1.0.2'); plistlib.dump(d,open(p,'wb'))"
      - name: Create DMG
        run: |
          mkdir -p dist/dmg
          cp -R dist/KeyStow.app dist/dmg/
          hdiutil create -volname KeyStow -srcfolder dist/dmg -ov -format UDZO dist/KeyStowMac.dmg
      - name: Stage Mac installer
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/KeyStowMac.dmg
          if-no-files-found: error

  publish:
    permissions:
      contents: write
    needs: [build, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Create absent exact-commit lightweight tag after dispatch approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v1.0.2" --jq '.[] | select(.ref == "refs/tags/v1.0.2") | .object.sha')
          if [ -n "$tag_sha" ]; then
            test "$tag_sha" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/v1.0.2 -f sha="$GITHUB_SHA"
          fi
          tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/v1.0.2" --jq '.object.sha')
          test "$tag_sha" = "$GITHUB_SHA"
      - uses: actions/checkout@v4
      - name: Download this run's Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installers
      - name: Download this run's Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: installers
      - name: Verify both artifacts exist
        run: |
          test -s installers/KeyStowSetup.exe
          test -s installers/KeyStowMac.dmg
          sha256sum installers/KeyStowSetup.exe installers/KeyStowMac.dmg
      - name: Publish new patch release without overwriting assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/v1.0.2" --jq '.object.sha')
          test "$tag_sha" = "$GITHUB_SHA"
          gh release create v1.0.2 --draft installers/KeyStowSetup.exe installers/KeyStowMac.dmg --verify-tag --title "KeyStow v1.0.2" --notes "Local voice typing for Windows and Apple Silicon Mac. Recovery update: paste-key cleanup and conditional clipboard restoration, best-effort local diagnostic logging, retryable login registration, safe Mac login-file serialization and replacement, and bounded startup-storage recovery with a visible warning and retry after user repair. Hold-to-speak remains the default for uncustomized installs; explicit modes and legacy custom keys are preserved. Built and component-tested; installed microphone, global shortcut, paste and real Mac login acceptance remain unverified. Clipboard insertion remains focus-dependent and restoration preserves text only. Download the installer for your platform. These downloads provide the installers directly. No payment is collected."
          gh api "repos/$GH_REPO/releases/tags/v1.0.2" > draft-release.json
          python installer/verify_release_assets.py draft-release.json installers
          gh release edit v1.0.2 --draft=false --latest --verify-tag
