name: Build Windows installer

on:
  push:
    branches: [main]
    paths: ['run_keystow.py', 'keystow/**', 'requirements.txt', 'installer/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Generate app icons
        run: python installer/make_icons.py
      - name: Fetch RNNoise native library
        run: |
          pip download pyrnnoise==0.4.5 --no-deps --platform win_amd64 --python-version 3.11 --only-binary :all: -d vendor_dl
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('vendor_dl/*.whl')[0]); z.extract('pyrnnoise-0.4.5.data/purelib/pyrnnoise/rnnoise.dll','vendor_dl')"
          copy vendor_dl\pyrnnoise-0.4.5.data\purelib\pyrnnoise\rnnoise.dll keystow\vendor\rnnoise.dll
      - name: Download bundled Whisper base model
        run: |
          pip install huggingface-hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-base', local_dir='models/faster-whisper-base')"
      - name: Build KeyStow.exe with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name KeyStow --icon installer\keystow.ico --add-data "models/faster-whisper-base;models/faster-whisper-base" --add-binary "keystow/vendor/rnnoise.dll;keystow/vendor" --collect-all faster_whisper --collect-all ctranslate2 run_keystow.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc installer\setup.iss
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.1 installer\installer\KeyStowSetup.exe --clobber || gh release create v1.0.1 installer\installer\KeyStowSetup.exe --target $env:GITHUB_SHA --title "KeyStow v1.0.1" --notes "Private push-to-talk voice typing for Windows. Download KeyStowSetup.exe, run it, and KeyStow appears in your tray. New/default installs: hold Right Ctrl while speaking, release to transcribe and request paste. Existing custom-key settings retain toggle unless explicitly changed. Real-machine acceptance is still pending."

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Generate app icons
        run: python installer/make_icons.py
      - name: Download bundled Whisper base model
        run: |
          pip install huggingface-hub
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-base', local_dir='models/faster-whisper-base')"
      - name: Build KeyStow.app with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name KeyStow --icon installer/keystow.icns --add-data "models/faster-whisper-base:models/faster-whisper-base" --collect-all faster_whisper --collect-all ctranslate2 run_keystow.py
      - name: Set macOS bundle version
        run: |
          python -c "import plistlib; p='dist/KeyStow.app/Contents/Info.plist'; d=plistlib.load(open(p,'rb')); d.update(CFBundleShortVersionString='1.0.1', CFBundleVersion='1.0.1'); plistlib.dump(d,open(p,'wb'))"
      - name: Create DMG
        run: |
          mkdir -p dist/dmg
          cp -R dist/KeyStow.app dist/dmg/
          hdiutil create -volname KeyStow -srcfolder dist/dmg -ov -format UDZO dist/KeyStowMac.dmg
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.1 dist/KeyStowMac.dmg --clobber || gh release create v1.0.1 dist/KeyStowMac.dmg --target "$GITHUB_SHA" --title "KeyStow v1.0.1" --notes "Local voice typing for Windows and Apple Silicon Mac. v1.0.1 introduces hold-to-speak by default for uncustomized installs, preserves legacy custom-key toggle and explicit modes, and fixes interrupted legacy-data migration. Existing custom keys may retain toggle; KEYSTOW_TOGGLE=0 explicitly selects hold. No installed hardware acceptance is claimed. Windows: run KeyStowSetup.exe. Mac: open KeyStowMac.dmg and allow required Microphone and Accessibility permissions. Unsigned/security behavior still requires real-device verification."
