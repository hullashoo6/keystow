name: Mac v1.0.3 signature repair only
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mac-v103-signature-repair
  cancel-in-progress: false
jobs:
  repair-mac-only:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1f8031c95d9be85fcf02e5a38293fc8475719a0c
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm exact release source and Apple Silicon
        run: |
          test "$(git rev-parse HEAD)" = 1f8031c95d9be85fcf02e5a38293fc8475719a0c
          test "$(uname -m)" = arm64
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
      - name: Record Windows asset before any build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.3 --repo hullashoo6/keystow --json assets > evidence/release-before.json
          gh release download v1.0.3 --repo hullashoo6/keystow --pattern KeyStowSetup.exe --dir windows-before
          echo 'b4fa29bfb8a276b5dfd7ac9511b1602636f61dffc4f519a3bc76c54d012044af  windows-before/KeyStowSetup.exe' | shasum -a 256 -c -
      - name: Install same Mac build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow psutil huggingface-hub
      - name: Generate app icon and fetch bundled base model
        run: |
          python installer/make_icons.py
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-base', local_dir='models/faster-whisper-base')"
      - name: Build Mac application only
        run: |
          pyinstaller --noconfirm --onefile --windowed --name KeyStow --icon installer/keystow.icns --add-data 'models/faster-whisper-base:models/faster-whisper-base' --collect-all faster_whisper --collect-all ctranslate2 run_keystow.py
      - name: Final metadata then ad-hoc re-sign, no further bundle edits
        run: |
          python -c "import plistlib; p='dist/KeyStow.app/Contents/Info.plist'; d=plistlib.load(open(p,'rb')); d.update(CFBundleShortVersionString='1.0.3', CFBundleVersion='1.0.3'); plistlib.dump(d,open(p,'wb'))"
          codesign --force --deep --sign - --preserve-metadata=entitlements dist/KeyStow.app
          codesign --verify --deep --strict --verbose=4 dist/KeyStow.app 2>&1 | tee evidence/app-signature-verify.txt
          codesign -d --verbose=4 dist/KeyStow.app 2>&1 | tee evidence/app-signature-details.txt
          file dist/KeyStow.app/Contents/MacOS/KeyStow | tee evidence/architecture.txt
      - name: Package and verify the actual mounted DMG bundle
        run: |
          set -euo pipefail
          mkdir -p dist/dmg
          ditto dist/KeyStow.app dist/dmg/KeyStow.app
          codesign --verify --deep --strict --verbose=4 dist/dmg/KeyStow.app
          hdiutil create -volname KeyStow -srcfolder dist/dmg -ov -format UDZO dist/KeyStowMac-signfix.dmg
          hdiutil verify dist/KeyStowMac-signfix.dmg 2>&1 | tee evidence/dmg-verify.txt
          mkdir -p "$RUNNER_TEMP/keystow-mounted"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/keystow-mounted" dist/KeyStowMac-signfix.dmg
          trap 'hdiutil detach "$RUNNER_TEMP/keystow-mounted"' EXIT
          codesign --verify --deep --strict --verbose=4 "$RUNNER_TEMP/keystow-mounted/KeyStow.app" 2>&1 | tee evidence/mounted-app-signature-verify.txt
          codesign -d --verbose=4 "$RUNNER_TEMP/keystow-mounted/KeyStow.app" 2>&1 | tee evidence/mounted-app-signature-details.txt
          python -c "import hashlib,json,pathlib; p=pathlib.Path('dist/KeyStowMac-signfix.dmg'); print(json.dumps({'file':p.name,'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'source_sha':'1f8031c95d9be85fcf02e5a38293fc8475719a0c','signing':'ad-hoc, not notarized','real_mac_owner_test':False},indent=2))" | tee evidence/mac-checksum.json
      - name: Publish new Mac asset, leave old links and Windows untouched
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.3 dist/KeyStowMac-signfix.dmg --repo hullashoo6/keystow
          gh release download v1.0.3 --repo hullashoo6/keystow --pattern KeyStowSetup.exe --dir windows-after
          cmp windows-before/KeyStowSetup.exe windows-after/KeyStowSetup.exe
          echo 'b4fa29bfb8a276b5dfd7ac9511b1602636f61dffc4f519a3bc76c54d012044af  windows-after/KeyStowSetup.exe' | shasum -a 256 -c - | tee evidence/windows-after-check.txt
          gh release view v1.0.3 --repo hullashoo6/keystow --json assets > evidence/release-after.json
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-v103-signature-repair-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: error
